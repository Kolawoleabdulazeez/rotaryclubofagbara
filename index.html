<!DOCTYPE html>
<html>
<head>
    <title>My First Web Page</title>
</head>
<body>
   <nav class="navbar">
        <div class="logo">
            <a href="#">Logo</a>
        </div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
            <li><a href="#services">Services</a></li>
            <br>
            <div>
                <button class="Login">Login</button>
            </div>
            <br>
            <div>
                <button class="SignUp">Sign Up</button>
            </div>
        </ul>
   </nav>
    <form>
        <div>
            <label for="Firstname" >First Name:</label>
            <input type="text" id="FirstName" name="Firstname" Placeholder="Esther">
        </div>
        <br>
        <div>
            <label for="Lastname">Last Name:</label>
            <input type="text" id="Last Name" name="Last Name" Placeholder="Apabiri">
        </div>
        <br>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" Placeholder="eapabiri@gmail.com">
        </div>
        <br>
         <div>
            <label for="tel">Phone Number:</label>
            <input type="tel" id="tel" name="tel" Placeholder="+234">
        </div>
        <br>
        <div>
            <label for="birthday"> Birthday:</label>
            <input type="date" id="birthday" name="birthday">
        </div>
        <br>
        <div>
            <label for="quantity"> Quantity:</label>
            <input type="number" id="quantity" name ="quantity" min="1" max="9">
        </div>
        <br>
        <div>
            <label for="Religion"> Religion:</label>
            <label>Christian</label>
            <input type="radio" name="Religion">
            <label>Muslim</label>
            <input type="radio" name="Religion">
            <label>Traditionalist</label>
            <input type="radio" name="Religion">
        </div>
        <br>
        <div>
            <label for="payment Method"> Payment Method</label>
            <select>
                <option>Verve</option>
                <option>Visa</option>
                <option>Mastercard</option>
            </select>
        </div>
        <br>
        <div>
            <input type="reset">
        </div>
 
        <br>
 
        <div>
            <input type="submit">
        </div>
       
 
    </form>
</body>
</html>
